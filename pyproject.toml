[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salespulse"
version = "1.0.0"
description = "SalesPulse — a reproducible sales analytics and automated reporting system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SalesPulse Portfolio Project" }]
keywords = ["analytics", "sql", "sqlite", "streamlit", "data-quality", "portfolio"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Database",
]
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "SQLAlchemy>=2.0,<3",
    "streamlit>=1.40,<2",
    "plotly>=5.24,<7",
    "openpyxl>=3.1,<4",
    "tabulate>=0.9,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9",
    "playwright>=1.48",
    "python-xlib>=0.33",
]

[project.scripts]
salespulse = "salespulse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["salespulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning:salespulse.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "output", "docs/screenshots"]
src = ["salespulse", "tests", "app.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501", "C408"]

[tool.ruff.lint.isort]
known-first-party = ["salespulse"]
